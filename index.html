<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>专注</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23ff7a1a' stroke-width='6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="app.css?v=20261031i">
    <link rel="stylesheet" href="focus.css?v=20261031i">
</head>

<body>
    <main id="config-container" class="page">
        <section class="page-side hero">
            <div id="hero-dial" class="dial focus-dial">
                <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
                    <defs><linearGradient id="dial-gradient" x1="0" y1="0" x2="1" y2="1"><stop class="dial-stop-a" offset="0"/><stop class="dial-stop-b" offset="1"/></linearGradient></defs>
                    <circle class="ring-track" cx="100" cy="100" r="94" pathLength="1"></circle>
                    <circle class="ring-ticks" cx="100" cy="100" r="84" pathLength="60"></circle>
                    <circle class="ring-ticks-major" cx="100" cy="100" r="85.2" pathLength="12"></circle>
                    <circle class="ring-value" cx="100" cy="100" r="94" pathLength="1"></circle>
                </svg>
                <div id="hero-clock" class="clock"></div>
            </div>
        </section>

        <div class="page-main">
            <section class="group">
                <div class="row">
                    <div class="segmented three" role="group" aria-label="模式">
                        <button id="mode-fixed" class="active" type="button">固定</button>
                        <button id="mode-random" type="button">随机</button>
                        <button id="mode-surprise" type="button">全随机</button>
                    </div>
                </div>
                <div class="row">
                    <span>隐藏时间</span>
                    <button id="hide-time-toggle" class="switch" type="button" role="switch" aria-checked="false" aria-label="隐藏时间"></button>
                </div>
            </section>

            <section id="config-items" class="group">
                <div class="row row-slider">
                    <label for="initial-time-input">初始</label>
                    <span class="value-field"><input type="number" id="initial-time-input" inputmode="decimal" value="5" step="1"><span class="unit">分钟</span></span>
                    <input type="range" id="initial-time-slider" min="5" max="20" value="5" aria-label="初始时间">
                </div>
                <div class="row row-slider">
                    <label for="cooling-time-input">冷静</label>
                    <span class="value-field"><input type="number" id="cooling-time-input" inputmode="decimal" value="3" step="1"><span class="unit">分钟</span></span>
                    <input type="range" id="cooling-time-slider" min="1" max="10" value="3" aria-label="冷静时间">
                </div>
                <div class="row row-slider">
                    <label for="multiplier-input">倍率</label>
                    <span class="value-field"><input type="number" id="multiplier-input" inputmode="decimal" value="1.0" step="0.1"><span class="unit">×</span></span>
                    <input type="range" id="multiplier-slider" min="1.0" max="5.0" value="1.0" step="0.1" aria-label="时间倍率">
                </div>
                <div class="row">
                    <label for="minimum-time-input">下轮最低</label>
                    <span class="value-field"><input type="number" id="minimum-time-input" inputmode="decimal" value="0" min="0" step="0.5"><span class="unit">分钟</span></span>
                </div>
            </section>

            <section id="random-mode-options" class="group hidden">
                <div class="row">
                    <div class="segmented">
                        <button id="mode-normal" class="mode-btn active" type="button">普通</button>
                        <button id="mode-ex" class="mode-btn" type="button">EX</button>
                    </div>
                </div>
                <div class="row">
                    <label for="random-initial-min">初始</label>
                    <span class="value-field">
                        <input id="random-initial-min" type="number" inputmode="decimal" min="0.1" step="0.5" value="10">
                        <span class="dash">–</span>
                        <input id="random-initial-max" type="number" inputmode="decimal" min="0.1" step="0.5" value="20" aria-label="初始上限">
                        <span class="unit">分钟</span>
                    </span>
                </div>
                <div class="row">
                    <label for="random-cooling-min">冷静</label>
                    <span class="value-field">
                        <input id="random-cooling-min" type="number" inputmode="decimal" min="0.1" step="0.1" value="2">
                        <span class="dash">–</span>
                        <input id="random-cooling-max" type="number" inputmode="decimal" min="0.1" step="0.1" value="4" aria-label="冷静上限">
                        <span class="unit">分钟</span>
                    </span>
                </div>
                <div class="row">
                    <label for="random-multiplier-min">倍率</label>
                    <span class="value-field">
                        <input id="random-multiplier-min" type="number" inputmode="decimal" min="0.1" step="0.1" value="1.5">
                        <span class="dash">–</span>
                        <input id="random-multiplier-max" type="number" inputmode="decimal" min="0.1" step="0.1" value="3" aria-label="倍率上限">
                        <span class="unit">×</span>
                    </span>
                </div>
                <div class="row">
                    <label for="random-min-next">下轮最低</label>
                    <span class="value-field"><input id="random-min-next" type="number" inputmode="decimal" min="0" step="0.5" value="0"><span class="unit">分钟</span></span>
                </div>
                <div class="row">
                    <label for="random-wild-chance">越界概率</label>
                    <span class="value-field"><input id="random-wild-chance" type="number" inputmode="numeric" min="0" max="50" step="1" value="8"><span class="unit">%</span></span>
                </div>
            </section>

            <details id="sprint-details" class="group">
                <summary>冲刺<svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></summary>
                <div class="details-body">
                    <div class="row">
                        <label for="sprint-chance">出现概率</label>
                        <span class="value-field"><input id="sprint-chance" type="number" inputmode="numeric" min="0" max="100" step="1" value="85"><span class="unit">%</span></span>
                    </div>
                    <div class="row">
                        <label for="sprint-ratio-min">占剩余时间</label>
                        <span class="value-field">
                            <input id="sprint-ratio-min" type="number" inputmode="numeric" min="1" max="300" step="1" value="10">
                            <span class="dash">–</span>
                            <input id="sprint-ratio-max" type="number" inputmode="numeric" min="1" max="300" step="1" value="30" aria-label="占剩余时间上限">
                            <span class="unit">%</span>
                        </span>
                    </div>
                    <div class="row">
                        <label for="sprint-min">时长</label>
                        <span class="value-field">
                            <input id="sprint-min" type="number" inputmode="decimal" min="0" step="0.5" value="2" placeholder="不限">
                            <span class="dash">–</span>
                            <input id="sprint-max" type="number" inputmode="decimal" min="0" step="0.5" value="" placeholder="不限" aria-label="时长上限">
                            <span class="unit">分钟</span>
                        </span>
                    </div>
                    <div class="row">
                        <label for="sprint-skip-cooling-chance">跳过冷静</label>
                        <span class="value-field"><input id="sprint-skip-cooling-chance" type="number" inputmode="numeric" min="0" max="25" step="1" value="3"><span class="unit">%</span></span>
                    </div>
                    <div class="row">
                        <label for="sprint-long-chance">超长概率</label>
                        <span class="value-field"><input id="sprint-long-chance" type="number" inputmode="numeric" min="0" max="30" step="1" value="4"><span class="unit">%</span></span>
                    </div>
                    <div class="row">
                        <label for="sprint-long-min">超长时长</label>
                        <span class="value-field">
                            <input id="sprint-long-min" type="number" inputmode="decimal" min="1" step="0.5" value="8">
                            <span class="dash">–</span>
                            <input id="sprint-long-max" type="number" inputmode="decimal" min="1" step="0.5" value="20" placeholder="不限" aria-label="超长上限">
                            <span class="unit">分钟</span>
                        </span>
                    </div>
                </div>
            </details>
        </div>
    </main>

    <!-- 完成页面 -->
    <main id="complete-container" class="complete hidden">
        <div class="complete-head">
            <span id="complete-mark" class="complete-mark">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
            </span>
            <h1 id="complete-title">完成</h1>
            <p id="total-time" class="complete-total">00:00</p>
        </div>
        <div id="complete-bar" class="complete-bar" aria-hidden="true"></div>
        <ol id="timeline" class="group timeline"></ol>
    </main>

    <div id="dock-fade" class="dock-fade"></div>
    <div id="dock" class="dock">
        <nav class="mode-switch" aria-label="切换计时器">
            <a href="index.html" aria-current="page"><span>专注</span></a>
            <a href="workout.html"><span>运动</span></a>
        </nav>
        <button id="confirm-btn" class="btn btn-primary" type="button">开始</button>
        <button id="restart-btn" class="btn btn-primary hidden" type="button">重新开始</button>
    </div>

    <!-- 计时页面 -->
    <section id="timer-container" class="timer-stage hidden">
        <div class="stage-top">
            <button id="peek-time-btn" class="stage-btn hidden" type="button">
                <span class="cooldown-overlay" id="peek-cooldown-bar"></span>
                <span class="btn-text">显示时间</span>
            </button>
            <button id="force-end-btn" class="stage-btn" type="button">
                <span class="btn-text">强制结束</span>
            </button>
        </div>

        <div class="stage-dial">
            <div class="halo" aria-hidden="true"></div>
            <div class="dial focus-dial">
                <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
                    <defs><linearGradient id="stage-gradient" x1="0" y1="0" x2="1" y2="1"><stop class="dial-stop-a" offset="0"/><stop class="dial-stop-b" offset="1"/></linearGradient></defs>
                    <circle class="ring-track" cx="100" cy="100" r="94" pathLength="1"></circle>
                    <circle class="ring-ticks" cx="100" cy="100" r="84" pathLength="60"></circle>
                    <circle class="ring-ticks-major" cx="100" cy="100" r="85.2" pathLength="12"></circle>
                    <circle class="ring-value" cx="100" cy="100" r="94" pathLength="1"></circle>
                </svg>
                <div class="sprint-fx" aria-hidden="true">
                    <i class="fx-glow"></i>
                    <i class="fx-wave"></i><i class="fx-wave"></i><i class="fx-wave"></i><i class="fx-wave"></i>
                    <i class="fx-comet"></i>
                </div>
                <div id="timer-display" class="clock" role="timer"></div>
            </div>
        </div>

        <div class="timer-controls">
            <div class="tempo-row">
                <button id="tempo-down-btn" class="tempo-btn minus" type="button" aria-label="降低动态节拍">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12h13"/></svg>
                </button>
                <div id="beat-dots" class="beat-dots hidden">
                    <div id="beat-dot-accent" class="beat-dot accent"></div>
                    <div id="beat-dot-normal" class="beat-dot normal"></div>
                </div>
                <button id="tempo-up-btn" class="tempo-btn plus" type="button" aria-label="提高动态节拍">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
                </button>
            </div>

            <div class="trigger-slot">
                <button id="trigger-btn" type="button" aria-label="结束当前阶段" class="trigger-button hidden"></button>
                <button id="resume-btn" type="button" class="resume-button hidden">继续</button>
            </div>
        </div>
    </section>

    <script src="ui.js?v=20261031i"></script>
    <script src="focus.js?v=20261031i"></script>
</body>

</html>
