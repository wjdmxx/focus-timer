<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>运动</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2330d158' stroke-width='6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="app.css?v=20261031i">
    <link rel="stylesheet" href="workout.css?v=20261031i">
</head>

<body>
    <main id="setup-view" class="page">
        <section class="page-side overview">
            <div class="dial plan-dial">
                <svg id="plan-ring" class="ring" viewBox="0 0 200 200" aria-hidden="true">
                    <circle class="ring-track" cx="100" cy="100" r="94" pathLength="1"></circle>
                </svg>
                <div class="plan-center">
                    <div id="plan-total" class="clock"></div>
                    <div id="plan-summary" class="plan-summary"></div>
                </div>
                <button id="regenerate-btn" class="icon-btn regenerate" type="button" aria-label="重新随机" title="重新随机">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.2a4 4 0 0 1 3.3 1.7l5 7.1a4 4 0 0 0 3.3 1.7H21M3 17.5h3.2a4 4 0 0 0 3.3-1.7l.8-1.1M14.2 9.2l.8-1.1A4 4 0 0 1 18.3 6.5H21M18.5 3.5l2.8 3-2.8 3M18.5 14.5l2.8 3-2.8 3"/></svg>
                </button>
            </div>
            <div id="stats" class="stats"></div>
        </section>

        <div class="page-main">
            <section>
                <div class="section-heading">
                    <h2>项目</h2>
                    <button id="add-exercise-btn" class="add-btn" type="button">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
                    </button>
                </div>
                <div id="config-list" class="config-list"></div>
            </section>

            <section class="group">
                <div class="row">
                    <label for="target-minutes">每份时长</label>
                    <span class="value-field"><input id="target-minutes" type="number" inputmode="numeric" min="1" max="120" step="1" value="10"><span class="unit">分钟</span></span>
                </div>
                <div class="row">
                    <label for="prepare-seconds">准备</label>
                    <span class="value-field"><input id="prepare-seconds" type="number" inputmode="numeric" min="0" max="120" step="1" value="5"><span class="unit">秒</span></span>
                </div>
                <div class="row">
                    <span>组间休息</span>
                    <div id="rest-switch" class="segmented compact" role="group" aria-label="组间休息">
                        <input type="hidden" id="rest-mode" value="random">
                        <button class="active" type="button" data-value="random">随机</button>
                        <button type="button" data-value="fixed">固定</button>
                    </div>
                </div>
                <div id="random-rest-fields" class="row">
                    <label for="rest-min-seconds">休息区间</label>
                    <span class="value-field">
                        <input id="rest-min-seconds" type="number" inputmode="numeric" min="0" max="600" step="1" value="30">
                        <span class="dash">–</span>
                        <input id="rest-max-seconds" type="number" inputmode="numeric" min="0" max="600" step="1" value="60" aria-label="最长休息">
                        <span class="unit">秒</span>
                    </span>
                </div>
                <div id="fixed-rest-fields" class="row" hidden>
                    <label for="rest-seconds">休息时长</label>
                    <span class="value-field"><input id="rest-seconds" type="number" inputmode="numeric" min="0" max="600" step="1" value="30"><span class="unit">秒</span></span>
                </div>
            </section>

            <details id="plan-details" class="group">
                <summary>计划<span class="summary-end"><svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></summary>
                <div class="details-body">
                    <div id="plan-list" class="plan-list"><div class="empty">暂无计划</div></div>
                </div>
            </details>
        </div>
    </main>

    <div id="dock-fade" class="dock-fade"></div>
    <div id="dock" class="dock">
        <nav class="mode-switch" aria-label="切换计时器">
            <a href="index.html"><span>专注</span></a>
            <a href="workout.html" aria-current="page"><span>运动</span></a>
        </nav>
        <button id="start-btn" class="btn btn-primary" type="button" disabled>开始</button>
    </div>

    <section id="session-view" class="session" hidden aria-label="运动中">
        <div class="session-glow" aria-hidden="true"></div>
        <header class="session-header">
            <div class="session-status"><span id="session-progress-label"></span><span id="session-remaining"></span></div>
            <button id="reset-btn" class="session-end" type="button">结束</button>
        </header>
        <div id="session-strip" class="session-strip" aria-hidden="true"></div>

        <div class="session-main">
            <section class="session-now" aria-label="当前阶段">
                <span class="done-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
                <div class="session-title">
                    <span id="current-type" class="current-type">准备</span>
                    <h2 id="current-name" class="current-name">准备开始</h2>
                </div>
                <div class="time-row">
                    <div id="time-display" class="clock time-display" role="timer"></div>
                    <span id="rep-total" class="rep-total" hidden></span>
                </div>
                <div class="rep-status">
                    <div id="beat-display" class="beat-display" hidden aria-hidden="true"><span id="light-beat"></span><span id="heavy-beat"></span></div>
                    <div id="rep-count" class="rep-count" hidden></div>
                </div>
                <div id="time-progress" class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
                <div id="rep-progress" class="rep-progress" hidden aria-hidden="true"></div>
            </section>

            <div class="session-side">
                <aside class="upcoming" aria-label="后续运动">
                    <div class="upcoming-heading"><h2>接下来</h2><span id="upcoming-count"></span></div>
                    <div id="upcoming-list" class="upcoming-list"></div>
                </aside>
                <div class="session-controls">
                    <button id="pause-btn" class="session-btn primary" type="button">
                        <svg class="glyph glyph-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.5"/></svg>
                        <svg class="glyph glyph-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.6c0-1.2 1.3-1.9 2.3-1.3l10 6.4c.9.6.9 2 0 2.6l-10 6.4c-1 .6-2.3-.1-2.3-1.3z"/></svg>
                        <span id="pause-label">暂停</span>
                    </button>
                    <button id="skip-btn" class="session-btn round" type="button" aria-label="跳过">
                        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.2c0-1.1 1.2-1.8 2.2-1.2l8.3 5.5c.9.6.9 2 0 2.6L6.7 18.6c-1 .6-2.2-.1-2.2-1.2z"/><rect x="16.5" y="4.5" width="3.5" height="15" rx="1.5"/></svg>
                    </button>
                </div>
                <p id="sound-status" class="sound-status" role="status"></p>
            </div>
        </div>
    </section>

    <script src="ui.js?v=20261031i"></script>
    <script src="workout.js?v=20261031i"></script>
</body>

</html>
