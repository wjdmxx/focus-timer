<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动计划计时器</title>
    <link rel="stylesheet" href="workout.css?v=20261002-refine">
</head>

<body>
    <main class="page">
        <div class="topbar" id="setup-heading">
            <h1>运动</h1>
            <a class="back-link" href="index.html">专注计时器</a>
        </div>

        <div class="layout" id="setup-view">
            <section class="panel">
                <h2>设置运动</h2>
                <div class="config-panel">
                    <div class="section-heading">
                        <div class="config-heading"><h3>运动配置</h3><span id="config-summary" class="config-summary"></span></div>
                        <button id="add-exercise-btn" class="add-exercise" type="button">＋ 新增运动</button>
                    </div>
                    <p class="section-note">按时间占比分配运动，随机安排每组。</p>
                    <div id="config-list" class="config-list"></div>
                </div>
                <div class="form-row">
                    <label for="target-minutes">每 1 份占比目标时间（分钟）</label>
                    <input id="target-minutes" type="number" min="1" max="120" step="1" value="10">
                </div>
                <div class="config-fields timing-settings">
                    <label class="config-label" for="rest-mode">组间休息<select id="rest-mode"><option value="random" selected>随机时长</option><option value="fixed">固定时长</option></select></label>
                    <label class="config-label" for="prepare-seconds">每组准备（秒）<input id="prepare-seconds" type="number" min="0" max="120" step="1" value="5"></label>
                </div>
                <div id="random-rest-fields" class="config-fields">
                    <label class="config-label" for="rest-min-seconds">最短休息（秒）<input id="rest-min-seconds" type="number" min="0" max="600" step="1" value="30"></label>
                    <label class="config-label" for="rest-max-seconds">最长休息（秒）<input id="rest-max-seconds" type="number" min="0" max="600" step="1" value="60"></label>
                </div>
                <div id="fixed-rest-fields" class="config-fields" hidden>
                    <label class="config-label" for="rest-seconds">休息时长（秒）<input id="rest-seconds" type="number" min="0" max="600" step="1" value="30"></label>
                </div>
                <p class="section-note">设为 0 可关闭休息或准备。</p>
                <div class="button-row">
                    <button id="generate-btn" class="primary">生成计划</button>
                    <button id="regenerate-btn" class="secondary" disabled>重新随机</button>
                </div>

                <div class="stats" id="stats"></div>
            </section>

            <section class="panel plan-preview">
                <div class="section-heading"><h2>运动计划</h2><span id="plan-total" class="meta">等待生成</span></div>
                <p class="section-note" id="plan-summary">配置好运动后，生成本次计划。</p>
                <button id="start-btn" class="primary wide-btn" disabled>开始运动</button>
                <div id="plan-list" class="plan-list"><div class="empty">暂无计划</div></div>
            </section>
        </div>

        <section id="session-view" class="session" hidden aria-label="运动中">
            <header class="session-header">
                <div class="session-heading"><h1>运动</h1><span id="session-progress-label"></span></div>
                <div class="session-actions"><span id="session-remaining"></span><button id="reset-btn" class="secondary" type="button">结束</button></div>
            </header>
            <div class="session-layout">
                <section class="current-card" aria-label="当前阶段">
                    <div id="current-type" class="current-type">准备</div>
                    <div class="timer-face">
                        <h2 id="current-name" class="current-name">准备开始</h2>
                        <div id="time-display" class="time-display" role="timer">00:00</div>
                        <div class="rep-status">
                            <div id="beat-display" class="beat-display" hidden aria-hidden="true"><span id="light-beat"></span><span id="heavy-beat"></span></div>
                            <div id="rep-count" class="rep-count" hidden></div>
                        </div>
                    </div>
                    <div class="timer-footer">
                        <div id="time-progress" class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
                        <div id="rep-progress" class="rep-progress" hidden aria-hidden="true"></div>
                        <div class="session-controls"><button id="pause-btn" class="primary">暂停</button><button id="skip-btn" class="secondary">跳过</button></div>
                        <p id="sound-status" class="section-note" role="status"></p>
                    </div>
                </section>
                <aside class="upcoming-card" aria-label="后续运动">
                    <div class="section-heading"><h2>接下来</h2><span id="upcoming-count" class="meta"></span></div>
                    <div id="upcoming-list" class="upcoming-list"></div>
                </aside>
            </div>
        </section>
    </main>

    <script src="workout.js?v=20261002-refine"></script>
</body>
</html>
