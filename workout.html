<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动计划计时器</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            color: #172033;
        }

        body.jump-flash {
            animation: jumpFlash 180ms ease-out;
        }

        @keyframes jumpFlash {
            0% {
                background: #ffffff;
            }

            100% {
                background: #f3f4f6;
            }
        }

        .page {
            width: min(1040px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 28px 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            font-size: 28px;
            line-height: 1.2;
        }

        .back-link {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
            align-items: start;
        }

        .panel {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
            padding: 18px;
        }

        .form-row {
            display: grid;
            gap: 8px;
            margin-top: 16px;
        }

        label {
            font-weight: 750;
            color: #334155;
        }

        input {
            width: 100%;
            height: 46px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 18px;
            font-weight: 750;
            color: #172033;
            background: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            height: 46px;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 120ms ease, background 160ms ease;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .primary {
            background: #2563eb;
            color: #ffffff;
        }

        .primary:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .secondary {
            background: #e2e8f0;
            color: #172033;
        }

        .danger {
            background: #ef4444;
            color: #ffffff;
        }

        .wide-btn {
            width: 100%;
            margin-top: 10px;
        }

        .timer {
            display: grid;
            gap: 14px;
        }

        .current-type {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-width: 84px;
            height: 34px;
            border-radius: 8px;
            padding: 0 12px;
            font-weight: 850;
            color: #ffffff;
            background: #475569;
        }

        .current-type.a {
            background: #2563eb;
        }

        .current-type.b {
            background: #f97316;
        }

        .current-type.c {
            background: #16a34a;
        }

        .current-type.rest {
            background: #64748b;
        }

        .time-display {
            font-variant-numeric: tabular-nums;
            font-size: clamp(56px, 9vw, 96px);
            line-height: 1;
            font-weight: 950;
            letter-spacing: 0;
        }

        .current-name {
            min-height: 30px;
            font-size: 22px;
            font-weight: 850;
        }

        .meta {
            color: #64748b;
            font-weight: 700;
        }

        .progress-track {
            height: 12px;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 160ms linear;
        }

        .jump-progress {
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .rep-dot {
            height: 8px;
            border-radius: 8px;
            background: #d1d5db;
        }

        .rep-dot.done {
            background: #16a34a;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .stat {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            background: #f8fafc;
        }

        .stat-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
        }

        .plan-list {
            display: grid;
            gap: 8px;
            margin-top: 14px;
            max-height: 58vh;
            overflow: auto;
            padding-right: 4px;
        }

        .plan-item {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            align-items: center;
            gap: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            background: #ffffff;
        }

        .plan-item.active {
            border-color: #2563eb;
            box-shadow: inset 3px 0 0 #2563eb;
        }

        .plan-item.done {
            opacity: 0.55;
        }

        .badge {
            height: 32px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 950;
            color: #ffffff;
        }

        .badge.a {
            background: #2563eb;
        }

        .badge.b {
            background: #f97316;
        }

        .badge.c {
            background: #16a34a;
        }

        .badge.rest {
            background: #64748b;
        }

        .item-title {
            font-weight: 850;
        }

        .item-subtitle {
            color: #64748b;
            font-size: 13px;
            font-weight: 650;
            margin-top: 2px;
        }

        .item-time {
            font-variant-numeric: tabular-nums;
            font-weight: 900;
            color: #334155;
        }

        .empty {
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 28px;
            text-align: center;
            color: #64748b;
            font-weight: 700;
        }

        .config-panel {
            margin-top: 16px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .section-note {
            margin-top: 6px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        .config-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .exercise-config {
            border: 1px solid #dbe3ef;
            border-left: 4px solid var(--exercise-color, #2563eb);
            border-radius: 8px;
            padding: 14px;
            background: #f8fafc;
        }

        .config-top,
        .config-fields,
        .option-row {
            display: grid;
            gap: 8px;
        }

        .config-top {
            grid-template-columns: minmax(90px, 1fr) 100px auto;
            align-items: end;
        }

        .config-fields {
            grid-template-columns: 1fr 1fr;
            margin-top: 12px;
        }

        .config-label {
            display: grid;
            gap: 5px;
            color: #475569;
            font-size: 12px;
            font-weight: 800;
        }

        .config-panel input,
        .config-panel select {
            height: 38px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 9px;
            font: inherit;
            font-weight: 700;
            color: #172033;
            background: #ffffff;
        }

        .config-panel input:focus,
        .config-panel select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 20px;
        }

        .icon-btn:hover:not(:disabled) {
            background: #fecaca;
        }

        .options-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 14px;
            color: #475569;
            font-size: 13px;
            font-weight: 850;
        }

        .text-btn {
            height: 30px;
            padding: 0 9px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
        }

        .option-list {
            display: grid;
            gap: 7px;
            margin-top: 8px;
        }

        .option-row {
            grid-template-columns: 1fr 1fr 58px 30px;
            align-items: end;
        }

        .option-row .config-label {
            font-size: 11px;
        }

        .remove-option {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 6px;
            background: transparent;
            color: #64748b;
            font-size: 18px;
        }

        .remove-option:hover:not(:disabled) {
            background: #e2e8f0;
        }

        .add-exercise {
            width: 100%;
            margin-top: 12px;
            border: 1px dashed #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .config-summary {
            margin-top: 10px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }

        @media (max-width: 520px) {
            .config-top {
                grid-template-columns: 1fr 74px auto;
            }

            .option-row {
                grid-template-columns: 1fr 1fr 48px 30px;
            }
        }

        @media (max-width: 820px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
        [hidden] { display: none !important; }
        button:focus-visible, a:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
        input, select { min-width: 0; }
        .plan-preview { position: sticky; top: 24px; }
        .timing-settings { margin-top: 20px; }
        .timing-settings input { font-size: 18px; }
        .session { --accent: #2563eb; }
        .session-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
        .session-header button { padding: 0 18px; }
        .eyebrow { color: #64748b; font-size: 13px; letter-spacing: .08em; margin-bottom: 8px; }
        .session-overview { margin-bottom: 24px; font-size: 14px; font-weight: 700; color: #64748b; }
        .session-overview .progress-track { height: 6px; margin-top: 10px; }
        .session-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 24px; align-items: start; }
        .current-card, .upcoming-card { background: white; border: 1px solid #dbe3ef; border-radius: 24px; padding: 28px; min-width: 0; }
        .current-card { border-top: 5px solid var(--accent); text-align: center; box-shadow: 0 16px 50px #1720330a; }
        .current-card .current-name { font-size: clamp(26px, 4vw, 40px); margin: 32px 0 20px; overflow-wrap: anywhere; }
        .current-card .time-display { font-size: clamp(72px, 10vw, 128px); letter-spacing: -.04em; margin-bottom: 18px; }
        .current-card .meta { line-height: 1.6; }
        .current-card .progress-bar { background: var(--accent); }
        .stage-progress { margin-top: 28px; }
        .quarter-labels { display: flex; justify-content: space-between; margin-top: 8px; color: #94a3b8; font-size: 12px; }
        .session-controls { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-top: 24px; }
        .session-controls button { height: 54px; border-radius: 12px; }
        .beat-display { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
        .beat-display span { padding: 9px 22px; border-radius: 100px; background: #f1f5f9; color: #94a3b8; border: 2px solid transparent; }
        #light-beat.active { border-color: var(--accent); color: var(--accent); }
        #heavy-beat.active { background: var(--accent); color: white; }
        .rep-count { margin-top: 12px; font-weight: 800; color: var(--accent); }
        .upcoming-card h2 { font-size: 20px; }
        .upcoming-list { display: grid; gap: 12px; margin-top: 20px; }
        .upcoming-item { padding: 16px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .upcoming-item:first-child { background: #eff6ff; border-color: #bfdbfe; }
        .upcoming-item .item-title { margin: 6px 0; overflow-wrap: anywhere; }
        .upcoming-label { font-size: 11px; font-weight: 800; color: #64748b; }
        .item-title { overflow-wrap: anywhere; }
        @media (orientation: portrait), (max-width: 640px) {
            .session-layout { grid-template-columns: 1fr; gap: 16px; }
            .current-card { padding: 22px; }
            .current-card .current-name { margin-top: 22px; }
            .upcoming-card { padding: 22px; }
            .plan-preview { position: static; }
        }
        @media (orientation: portrait) and (max-width: 600px) {
            .page { padding: 18px 0; }
            .session-header, .session-overview { margin-bottom: 16px; }
            .session-header h1 { font-size: 24px; }
            .session-header button { height: 42px; font-size: 14px; }
            .eyebrow { font-size: 12px; margin-bottom: 4px; }
            .current-card, .upcoming-card { padding: 18px; }
            .current-card .current-name { margin: 16px 0 10px; }
            .current-card .time-display { margin-bottom: 12px; }
            .current-card > .meta { font-size: 13px; }
            .beat-display { margin-top: 12px; }
            .beat-display span { padding: 6px 18px; }
            .rep-count { margin-top: 8px; }
            .stage-progress, .session-controls { margin-top: 16px; }
            .session-controls button { height: 46px; }
            .upcoming-card > .section-note { display: none; }
            .upcoming-list { margin-top: 12px; gap: 8px; }
            .upcoming-item { padding: 12px; }
        }
        @media (orientation: landscape) and (max-height: 600px) {
            .page { padding: 12px 0; }
            .session-header, .session-overview { margin-bottom: 8px; }
            .session-header button { height: 36px; font-size: 14px; }
            .session-header h1 { font-size: 22px; }
            .eyebrow { display: none; }
            .session-overview { font-size: 12px; }
            .session-overview .progress-track { margin-top: 6px; }
            .session-layout { gap: 16px; grid-template-columns: minmax(0, 1.6fr) minmax(220px, 1fr); }
            .current-card, .upcoming-card { padding: 12px; border-radius: 16px; }
            .current-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; }
            .current-card > .section-heading, .current-card > .meta, .stage-progress, .session-controls, #sound-status { grid-column: 1 / -1; }
            .current-card .current-type { height: 28px; font-size: 13px; }
            .current-card .current-name { font-size: 24px; margin: 0; }
            .current-card .time-display { font-size: 56px; margin: 0; }
            .current-card .meta { font-size: 12px; }
            .stage-progress, .session-controls, .beat-display, .rep-count { margin-top: 0; }
            .quarter-labels { display: none; }
            .session-controls button { height: 40px; }
            .beat-display { gap: 6px; }
            .beat-display span { padding: 4px 12px; font-size: 12px; }
            .rep-count { font-size: 13px; }
            .upcoming-card > .section-note { display: none; }
            .upcoming-list { margin-top: 10px; gap: 8px; max-height: calc(100dvh - 154px); overflow-y: auto; }
            .upcoming-item { padding: 8px 10px; }
            .upcoming-item .item-title { margin: 3px 0; }
        }
        #sound-status:empty { display: none; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>

<body>
    <main class="page">
        <div class="topbar" id="setup-heading">
            <h1>运动计划计时器</h1>
            <a class="back-link" href="index.html">返回专注计时器</a>
        </div>

        <div class="layout" id="setup-view">
            <section class="panel">
                <h2>生成计划</h2>
                <div class="config-panel">
                    <div class="section-heading">
                        <h3>运动配置</h3>
                        <span id="config-summary" class="config-summary"></span>
                    </div>
                    <p class="section-note">占比是每类运动的目标时间比例，不要求精确相等。时间型按秒随机，次数型按每次耗时换算。</p>
                    <div id="config-list" class="config-list"></div>
                    <button id="add-exercise-btn" class="add-exercise" type="button">＋ 新增运动</button>
                </div>
                <div class="form-row">
                    <label for="target-minutes">每 1 份占比目标时间（分钟）</label>
                    <input id="target-minutes" type="number" min="1" max="120" step="1" value="10">
                </div>
                <div class="config-fields timing-settings">
                    <label class="config-label" for="rest-seconds">组间休息（秒）<input id="rest-seconds" type="number" min="0" max="600" step="1" value="30"></label>
                    <label class="config-label" for="prepare-seconds">每组准备（秒）<input id="prepare-seconds" type="number" min="0" max="120" step="1" value="5"></label>
                </div>
                <p class="section-note">每组运动前先准备，组间先休息再准备。填 0 可关闭。</p>
                <div class="button-row">
                    <button id="generate-btn" class="primary">生成计划</button>
                    <button id="regenerate-btn" class="secondary" disabled>重新随机</button>
                </div>

                <div class="stats" id="stats"></div>
            </section>

            <section class="panel plan-preview">
                <div class="section-heading"><h2>运动计划</h2><span id="plan-total" class="meta">等待生成</span></div>
                <p class="section-note" id="plan-summary">配置好运动后，生成本次计划。</p>
                <button id="start-btn" class="primary wide-btn" disabled>开始运动</button>
                <div id="plan-list" class="plan-list"><div class="empty">暂无计划</div></div>
            </section>
        </div>

        <section id="session-view" class="session" hidden aria-label="运动中">
            <header class="session-header">
                <div><div class="eyebrow">专注当下 · 跟随节奏</div><h1>本次运动</h1></div>
                <button id="reset-btn" class="secondary" type="button">结束并返回</button>
            </header>
            <div class="session-overview">
                <div class="section-heading"><span id="session-progress-label">本次进度</span><span id="session-remaining"></span></div>
                <div class="progress-track"><div id="session-progress" class="progress-bar"></div></div>
            </div>
            <div class="session-layout">
                <section class="current-card" aria-label="当前阶段">
                    <div class="section-heading"><span id="current-type" class="current-type">准备</span><span id="current-position" class="meta"></span></div>
                    <h2 id="current-name" class="current-name">准备开始</h2>
                    <div id="time-display" class="time-display" role="timer">00:00</div>
                    <div id="current-meta" class="meta"></div>
                    <div id="beat-display" class="beat-display" hidden><span id="light-beat">轻拍</span><span id="heavy-beat">重拍</span></div>
                    <div id="rep-count" class="rep-count" hidden></div>
                    <div class="stage-progress"><div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div><div class="quarter-labels"><span>开始</span><span>¼</span><span>½</span><span>¾</span><span>完成</span></div></div>
                    <div class="session-controls"><button id="pause-btn" class="primary">暂停</button><button id="skip-btn" class="secondary">跳过阶段</button></div>
                    <p id="sound-status" class="section-note" role="status"></p>
                </section>
                <aside class="upcoming-card" aria-label="后续运动">
                    <div class="section-heading"><h2>接下来</h2><span id="upcoming-count" class="meta"></span></div>
                    <p class="section-note">下一组与后续运动</p>
                    <div id="upcoming-list" class="upcoming-list"></div>
                </aside>
            </div>
        </section>
    </main>

    <script src="workout.js?v=20260927-3"></script>
</body>
</html>
